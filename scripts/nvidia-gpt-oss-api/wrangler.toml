name = "nvidia-gpt-oss-api"
main = "worker.js"
compatibility_date = "2026-08-15"

# OAuth token state is statelessly signed by the internal API_ACCESS_KEY secret.
# No Cloudflare KV namespace is required, so the existing Workers deployment
# token does not need additional KV permissions.

# Secrets are intentionally NOT stored in this file.
# NVIDIA_API_KEY is the NVIDIA Build key.
# API_ACCESS_KEY is the internal OAuth signing/owner authorization secret.
