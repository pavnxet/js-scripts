<style>
:root{--bg:#fff;--fg:#09090b;--muted:#71717a;--card:#fff;--soft:#f4f4f5;--line:#e4e4e7;--input:#fff;--primary:#18181b;--primary-fg:#fafafa;--ring:#a1a1aa;--danger:#dc2626;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.04);--sidebar:320px}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;overflow:hidden;transition:background .2s,color .2s}button,input,select,textarea{font:inherit}.app{display:flex;width:100%;height:100vh}.sidebar{width:var(--sidebar);min-width:var(--sidebar);height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--bg);padding:20px}.main{flex:1;min-width:0;height:100vh;overflow:auto}.container{max-width:1120px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.logo{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;background:var(--soft);font-weight:800}.brand strong{font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.panel{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card);box-shadow:var(--shadow)}.panel-title{font-size:13px;font-weight:650;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.label{display:block;font-size:12px;font-weight:500;margin-bottom:6px}.field{margin-bottom:12px}.field:last-child{margin-bottom:0}.input,.select{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--fg);padding:0 10px;outline:0;transition:border-color .15s,box-shadow .15s}.input:focus,.select:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(161,161,170,.14)}.textarea{height:76px;padding:9px 10px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:550;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s}.btn:hover{background:var(--soft)}.btn:active{transform:scale(.985)}.btn:focus-visible,.icon-btn:focus-visible,.slot:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.btn.primary:hover{opacity:.9}.btn.block{width:100%}.btn.small{height:32px;padding:0 9px;font-size:12px}.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;display:grid;place-items:center;transition:background .15s,transform .12s}.icon-btn:hover{background:var(--soft)}.toolbar{display:flex;gap:7px;align-items:center}.separator{height:1px;background:var(--line);margin:14px 0}.color{height:36px;width:100%;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--input)}.drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;background:var(--soft);cursor:pointer;transition:border-color .15s,background .15s,transform .15s}.drop:hover,.drop.active{border-color:var(--ring);transform:translateY(-1px)}.drop strong{display:block;font-size:12px}.drop span{font-size:11px;color:var(--muted)}.topbar{min-height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:var(--bg);z-index:10}.title h1{font-size:18px;letter-spacing:-.025em;margin:0}.title p{font-size:12px;color:var(--muted);margin:3px 0 0}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e}.stage{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:28px;min-height:calc(100vh - 122px);display:flex;justify-content:center;align-items:flex-start;overflow:auto}.sheet{width:148mm;height:210mm;background:#fff;box-shadow:0 12px 35px rgba(0,0,0,.14);flex:none;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1);transform:scale(var(--scale,1));transform-origin:top center}.sheet-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);gap:var(--gap);padding:var(--pad)}.slot{position:relative;min-width:0;min-height:0;background:#fff;border:1px dashed #d4d4d8;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:grab;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}.slot:hover{border-color:#a1a1aa}.slot.selected{border:2px solid #18181b}.slot.over{background:#f4f4f5;border-color:#18181b;transform:scale(.985)}.slot.empty::after{content:attr(data-index);font-size:10px;color:#d4d4d8}.slot img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.slot .label{font-size:7pt;line-height:1.2;text-align:center;color:#18181b;margin:0;padding:1mm .5mm 0;max-height:18%;overflow:hidden;width:100%;word-break:break-word;flex:none}.slot[data-fit="cover"] img{object-fit:cover}.slot[data-fit="fill"] img{object-fit:fill}.slot[data-fit="contain"] img{object-fit:contain}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted)}.range{width:100%}.range-row{display:flex;align-items:center;gap:8px}.range-row output{min-width:40px;text-align:right;font-size:11px;color:var(--muted)}.hidden{display:none!important}.preview{height:150px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;margin-bottom:10px}.preview canvas,.preview img{max-width:88%;max-height:88%}.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px}.toast{background:var(--primary);color:var(--primary-fg);border-radius:8px;padding:9px 12px;box-shadow:0 8px 30px rgba(0,0,0,.15);font-size:12px;animation:toastIn .18s ease}.toast.out{animation:toastOut .16s ease forwards}@keyframes toastIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes toastOut{to{opacity:0;transform:translateY(5px)}}.menu{position:fixed;display:none;z-index:50;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.12)}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:transparent;color:var(--fg);text-align:left;padding:8px;border-radius:6px;cursor:pointer;font-size:12px}.menu button:hover{background:var(--soft)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){body{overflow:auto}.app{display:block;height:auto}.sidebar{width:100%;height:auto;min-width:0;border-right:0;border-bottom:1px solid var(--line)}.main{height:auto;overflow:visible}.topbar{padding:14px 16px;align-items:flex-start}.toolbar{flex-wrap:wrap}.container{padding:14px}.stage{min-height:600px;padding:16px}.sheet{transform:scale(min(var(--scale,1),.82))}}
@page{size:148mm 210mm;margin:0}@media print{html,body,.app,.main{width:148mm!important;height:210mm!important;min-height:210mm!important;background:#fff!important;overflow:hidden!important;display:block!important}.no-print{display:none!important}.stage{padding:0!important;border:0!important;background:#fff!important;min-height:0!important;display:block!important;overflow:visible!important}.sheet{position:fixed;left:0;top:0;width:148mm!important;height:210mm!important;transform:none!important;box-shadow:none!important}.sheet-grid{width:100%!important;height:100%!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
</style></head>
<body><div class="app"><aside class="sidebar no-print"><div class="brand"><div class="logo">QR</div><div><strong>QR Print Station</strong><small>A5 Print Studio</small></div></div>
<section class="panel"><div class="panel-title">Generate QR <span class="badge" id="qrStatus">Ready</span></div><div class="field"><label class="label">Content</label><textarea class="input textarea" id="qrText" placeholder="URL, text, Wi‑Fi details…"></textarea></div><div class="preview" id="preview"></div><div class="grid2"><div class="field"><label class="label">Target slot</label><select class="select" id="target"></select></div><div class="field"><label class="label">Label</label><input class="input" id="labelText" placeholder="Optional"></div></div><div class="grid2"><div class="field"><label class="label">Foreground</label><input class="color" id="dark" type="color" value="#000000"></div><div class="field"><label class="label">Background</label><input class="color" id="light" type="color" value="#ffffff"></div></div><button class="btn primary block" id="addQr">＋ Add QR to sheet</button></section>
<section class="panel"><div class="panel-title">Grid</div><div class="field"><label class="label">Preset</label><select class="select" id="preset"><option value="2">2 × 2</option><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option><option value="custom">Custom</option></select></div><div class="grid2 hidden" id="customGrid"><div class="field"><label class="label">Columns</label><input class="input" id="cols" type="number" min="1" max="10" value="4"></div><div class="field"><label class="label">Rows</label><input class="input" id="rows" type="number" min="1" max="10" value="4"></div></div><button class="btn block" id="applyGrid">Apply grid</button><div class="grid2" style="margin-top:10px"><div class="field"><label class="label">Gap (mm)</label><input class="input" id="gap" type="number" min="0" max="10" step=".5" value="2"></div><div class="field"><label class="label">Padding (mm)</label><input class="input" id="pad" type="number" min="0" max="10" step=".5" value="2"></div></div></section>
<section class="panel"><div class="panel-title">Images</div><div class="drop" id="drop"><strong>Drop images here</strong><span>or click to choose PNG / JPG / WebP</span><input class="sr-only" id="files" type="file" accept="image/*" multiple></div><div class="grid2" style="margin-top:10px"><button class="btn" id="shuffle">Shuffle</button><button class="btn" id="clear">Clear all</button></div><div class="field" style="margin-top:10px"><label class="label">Image fit</label><select class="select" id="fit"><option value="contain">Contain</option><option value="cover">Cover</option><option value="fill">Fill</option></select></div></section>
<section class="panel"><div class="panel-title">View</div><div class="range-row"><input class="range" id="zoom" type="range" min="55" max="110" value="100"><output id="zoomOut">100%</output></div><div class="separator"></div><div class="grid2"><button class="btn" id="undo">↶ Undo</button><button class="btn" id="redo">↷ Redo</button></div></section></aside>
<main class="main"><header class="topbar no-print"><div class="title"><h1>QR Print Station</h1><p>A5 layout editor · shadcn-inspired interface</p></div><div class="toolbar"><div class="status"><span class="status-dot"></span><span id="statusText">Autosave on</span></div><button class="icon-btn" id="theme" title="Toggle theme">◐</button><button class="btn small" id="save">Save</button><button class="btn small" id="load">Load</button><button class="btn small" id="export">Export PNG</button><button class="btn small primary" id="print">Print</button><input class="sr-only" id="layoutFile" type="file" accept="application/json"></div></header><div class="container"><div class="stage"><div class="sheet" id="sheet"><div class="sheet-grid" id="grid"></div></div></div></div></main></div>
<div class="menu no-print" id="menu"><button data-action="rotate">Rotate 90°</button><button data-action="duplicate">Duplicate</button><button data-action="remove">Remove</button><button data-action="clearSlot">Clear slot</button></div><div class="toast-wrap" id="toasts"></div>
<script>
'use strict';const $=s=>document.querySelector(s);const state={cols:4,rows:4,gap:2,pad:2,scale:1,theme:localStorage.getItem('qr-theme')||'light',selected:0,slots:[],history:[],future:[],fit:'contain'};const grid=$('#grid'),sheet=$('#sheet'),target=$('#target'),preview=$('#preview'),menu=$('#menu');
function blank(){return{src:'',label:'',rotation:0,fit:state.fit}}function ensureSlots(n){while(state.slots.length<n)state.slots.push(blank());if(state.slots.length>n)state.slots.length=n}function snapshot(){return JSON.stringify({cols:state.cols,rows:state.rows,gap:state.gap,pad:state.pad,scale:state.scale,slots:state.slots,fit:state.fit})}function restore(s){const x=JSON.parse(s);state.cols=Math.max(1,Math.min(10,+x.cols||4));state.rows=Math.max(1,Math.min(10,+x.rows||4));state.gap=Math.max(0,Math.min(10,+x.gap||0));state.pad=Math.max(0,Math.min(10,+x.pad||0));state.scale=Math.max(.55,Math.min(1.1,+x.scale||1));state.fit=x.fit||'contain';state.slots=Array.isArray(x.slots)?x.slots.map(v=>({...blank(),...v})):[];ensureSlots(state.cols*state.rows);render()}function commit(){const s=snapshot();if(state.history[state.history.length-1]!==s){state.history.push(s);if(state.history.length>30)state.history.shift();state.future=[]}autosave()}function autosave(){try{localStorage.setItem('qr-print-station',snapshot());$('#statusText').textContent='Saved locally'}catch{$('#statusText').textContent='Local save unavailable'}}
function render(){ensureSlots(state.cols*state.rows);document.documentElement.dataset.theme=state.theme==='dark'?'dark':'';sheet.style.setProperty('--scale',state.scale);grid.style.setProperty('--cols',state.cols);grid.style.setProperty('--rows',state.rows);grid.style.setProperty('--gap',state.gap+'mm');grid.style.setProperty('--pad',state.pad+'mm');grid.innerHTML='';target.innerHTML='';state.slots.forEach((slot,i)=>{const el=document.createElement('div');el.className='slot '+(!slot.src?'empty ':'')+(i===state.selected?'selected':'');el.dataset.index=i+1;el.dataset.fit=slot.fit||state.fit;el.tabIndex=0;el.draggable=true;if(slot.src){const img=document.createElement('img');img.src=slot.src;img.alt=slot.label||'QR/image';img.style.transform='rotate('+((slot.rotation||0)%360)+'deg)';el.appendChild(img);if(slot.label){const lab=document.createElement('div');lab.className='label';lab.textContent=slot.label;el.appendChild(lab)}}el.onclick=()=>select(i);el.oncontextmenu=e=>openMenu(e,i);el.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(i));el.style.opacity='.55'};el.ondragend=()=>el.style.opacity='';el.ondragover=e=>{e.preventDefault();el.classList.add('over')};el.ondragleave=()=>el.classList.remove('over');el.ondrop=e=>{e.preventDefault();el.classList.remove('over');const from=+e.dataTransfer.getData('text/plain');if(Number.isInteger(from))swap(from,i)};el.onkeydown=e=>{if(e.key==='Delete')removeSlot(i);if(e.key.toLowerCase()==='r')rotate(i)};grid.appendChild(el);const opt=document.createElement('option');opt.value=i;opt.textContent='Slot '+(i+1)+(slot.src?' · filled':' · empty');target.appendChild(opt)});target.value=String(Math.min(state.selected,state.slots.length-1));$('#fit').value=state.fit;$('#zoom').value=Math.round(state.scale*100);$('#zoomOut').value=Math.round(state.scale*100)+'%'}function select(i){state.selected=i;render()}function swap(a,b){if(a===b)return;commit();[state.slots[a],state.slots[b]]=[state.slots[b],state.slots[a]];state.selected=b;render();pulse()}function removeSlot(i){if(!state.slots[i]?.src)return;commit();state.slots[i]=blank();state.selected=i;render();toast('Slot cleared')}function rotate(i=state.selected){if(!state.slots[i]?.src)return;commit();state.slots[i].rotation=((state.slots[i].rotation||0)+90)%360;render();pulse()}function duplicate(i=state.selected){if(!state.slots[i]?.src)return;const j=state.slots.findIndex((s,k)=>k!==i&&!s.src);if(j<0){toast('No empty slot available');return}commit();state.slots[j]={...state.slots[i]};state.selected=j;render();toast('Duplicated')}
function openMenu(e,i){e.preventDefault();state.selected=i;render();menu.dataset.index=i;menu.classList.add('open');menu.style.left=Math.min(e.clientX,innerWidth-190)+'px';menu.style.top=Math.min(e.clientY,innerHeight-150)+'px'}function closeMenu(){menu.classList.remove('open')}menu.onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+menu.dataset.index;({rotate:()=>rotate(i),duplicate:()=>duplicate(i),remove:()=>removeSlot(i),clearSlot:()=>removeSlot(i)})[b.dataset.action]?.();closeMenu()};document.addEventListener('click',e=>{if(!menu.contains(e.target))closeMenu()});
function makeQR(text){preview.innerHTML='';if(!text.trim())return;try{new QRCode(preview,{text:text.trim(),width:170,height:170,colorDark:$('#dark').value,colorLight:$('#light').value,correctLevel:QRCode.CorrectLevel.M});$('#qrStatus').textContent='Ready'}catch{preview.textContent='QR generation failed';$('#qrStatus').textContent='Error'}}function addQR(){const text=$('#qrText').value.trim();if(!text){toast('Enter QR content first');return}const i=+target.value;const temp=document.createElement('div');temp.style.cssText='position:absolute;left:-9999px;top:-9999px';document.body.appendChild(temp);try{new QRCode(temp,{text,width:900,height:900,colorDark:$('#dark').value,colorLight:$('#light').value,correctLevel:QRCode.CorrectLevel.M});setTimeout(()=>{const canvas=temp.querySelector('canvas');if(!canvas){temp.remove();toast('Could not create QR');return}commit();state.slots[i]={src:canvas.toDataURL('image/png'),label:$('#labelText').value.trim(),rotation:0,fit:state.fit};state.selected=i;temp.remove();render();pulse();toast('QR added to slot '+(i+1))},40)}catch{temp.remove();toast('Could not create QR')}}function pulse(){sheet.animate([{transform:'scale(var(--scale))'},{transform:'scale(calc(var(--scale) * 1.008))'},{transform:'scale(var(--scale))'}],{duration:260,easing:'ease-out'})}
function changeGrid(){let c,r;if($('#preset').value==='custom'){c=Math.max(1,Math.min(10,+$('#cols').value||4));r=Math.max(1,Math.min(10,+$('#rows').value||4))}else c=r=+$('#preset').value;commit();state.cols=c;state.rows=r;ensureSlots(c*r);state.selected=Math.min(state.selected,state.slots.length-1);render();toast('Grid updated')}function saveFile(){const b=new Blob([snapshot()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='qr-print-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Layout downloaded')}function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{commit();restore(r.result);autosave();toast('Layout loaded')}catch{toast('Invalid layout file')}};r.readAsText(f)}
function exportPNG(){const W=1748,H=2480,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const sx=W/148,sy=H/210,g=state.gap,p=state.pad,cw=(148-2*p-g*(state.cols-1))/state.cols,ch=(210-2*p-g*(state.rows-1))/state.rows;Promise.all(state.slots.map((s,i)=>new Promise(res=>{if(!s.src)return res();const img=new Image();img.onload=()=>{const col=i%state.cols,row=Math.floor(i/state.cols),x=(p+col*(cw+g))*sx,y=(p+row*(ch+g))*sy,w=cw*sx,h=ch*sy;ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate((s.rotation||0)*Math.PI/180);const q=Math.min(w/img.width,h/img.height);ctx.drawImage(img,-img.width*q/2,-img.height*q/2,img.width*q,img.height*q);ctx.restore();if(s.label){ctx.fillStyle='#18181b';ctx.textAlign='center';ctx.font='26px sans-serif';ctx.fillText(s.label,x+w/2,y+h-12)}res()};img.onerror=()=>res();img.src=s.src}))).then(()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='qr-print-a5.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('PNG exported')},'image/png'))}
function shuffle(){const filled=state.slots.filter(s=>s.src);if(filled.length<2)return;commit();for(let i=filled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filled[i],filled[j]]=[filled[j],filled[i]]}let k=0;state.slots=state.slots.map(s=>s.src?filled[k++]:s);render();pulse();toast('Filled slots shuffled')}function clearAll(){if(!state.slots.some(s=>s.src))return;commit();state.slots=state.slots.map(blank);render();toast('Sheet cleared')}function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),180)},1800)}
$('#qrText').oninput=()=>makeQR($('#qrText').value);$('#dark').oninput=()=>makeQR($('#qrText').value);$('#light').oninput=()=>makeQR($('#qrText').value);$('#addQr').onclick=addQR;$('#target').onchange=e=>state.selected=+e.target.value;$('#preset').onchange=()=>$('#customGrid').classList.toggle('hidden',$('#preset').value!=='custom');$('#applyGrid').onclick=changeGrid;$('#gap').onchange=()=>{commit();state.gap=Math.max(0,Math.min(10,+$('#gap').value||0));render()};$('#pad').onchange=()=>{commit();state.pad=Math.max(0,Math.min(10,+$('#pad').value||0));render()};$('#fit').onchange=e=>{commit();state.fit=e.target.value;state.slots.forEach(s=>{if(s.src)s.fit=state.fit});render()};$('#zoom').oninput=e=>{state.scale=+e.target.value/100;render()};$('#zoom').onchange=()=>{commit();autosave()};$('#undo').onclick=()=>{if(!state.history.length)return;state.future.push(snapshot());restore(state.history.pop());toast('Undo')};$('#redo').onclick=()=>{if(!state.future.length)return;state.history.push(snapshot());restore(state.future.pop());toast('Redo')};$('#shuffle').onclick=shuffle;$('#clear').onclick=clearAll;$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('qr-theme',state.theme);render()};$('#save').onclick=saveFile;$('#load').onclick=()=>$('#layoutFile').click();$('#layoutFile').onchange=e=>loadFile(e.target.files[0]);$('#export').onclick=exportPNG;$('#print').onclick=()=>window.print();
const drop=$('#drop');drop.onclick=()=>$('#files').click();$('#files').onchange=e=>handleFiles(e.target.files);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('active')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('active')}));drop.addEventListener('drop',e=>handleFiles(e.dataTransfer.files));function handleFiles(files){const list=[...files].filter(f=>f.type.startsWith('image/'));if(!list.length)return;let idx=state.slots.findIndex(s=>!s.src);if(idx<0){toast('No empty slots available');return}commit();list.slice(0,state.slots.length-idx).forEach(file=>{const r=new FileReader();r.onload=()=>{if(idx<state.slots.length){state.slots[idx]={src:r.result,label:file.name.replace(/\.[^.]+$/,''),rotation:0,fit:state.fit};idx++;render();autosave()}};r.readAsDataURL(file)});toast('Images importing…')}
const saved=localStorage.getItem('qr-print-station');if(saved){try{restore(saved)}catch{ensureSlots(16);render()}}else{ensureSlots(16);render()}
</script></body></html>
