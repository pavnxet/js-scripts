name: Deploy Thinking MCP to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'thinking-mcp/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thinking-mcp/package.json

      - name: Install dependencies
        working-directory: thinking-mcp
        run: npm install

      - name: Verify Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Verifying Cloudflare API token..."
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "$RESPONSE" | jq '{success, result: {status, id}}'
          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare API token verification failed."
            exit 1
          fi
          echo "Verifying Cloudflare account access..."
          ACCOUNT=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}")
          echo "$ACCOUNT" | jq '{success, result: {id, name}}'
          if [ "$(echo "$ACCOUNT" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare token cannot access the configured account ID."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: thinking-mcp
