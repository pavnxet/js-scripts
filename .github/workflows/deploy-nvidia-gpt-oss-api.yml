name: Deploy NVIDIA GPT-OSS-120B API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nvidia-gpt-oss-api/**'
      - '.github/workflows/deploy-nvidia-gpt-oss-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/nvidia-gpt-oss-api/package.json

      - name: Install dependencies
        working-directory: scripts/nvidia-gpt-oss-api
        run: npm install

      - name: Configure OAuth registration for ChatGPT
        working-directory: scripts/nvidia-gpt-oss-api
        run: |
          set -euo pipefail
          # ChatGPT's connector is currently reaching this server with a CIMD
          # client_id URL. The Worker cannot reliably fetch ChatGPT's private
          # CIMD document from its server-side runtime, so advertise DCR instead.
          # DCR is explicitly supported by the MCP authorization specification.
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = 'client_id_metadata_document_supported: true'
          new = 'client_id_metadata_document_supported: false'
          if old not in s:
              raise SystemExit('Expected OAuth metadata flag was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "$RESPONSE" | jq '{success, result: {status, id}}'
          test "$(echo "$RESPONSE" | jq -r '.success')" = "true"
          ACCOUNT=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}")
          echo "$ACCOUNT" | jq '{success, result: {id, name}}'
          test "$(echo "$ACCOUNT" | jq -r '.success')" = "true"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scripts/nvidia-gpt-oss-api

      - name: Set NVIDIA API secret on Cloudflare
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          printf '%s' "$NVIDIA_API_KEY" | npx wrangler secret put NVIDIA_API_KEY

      - name: Set internal OAuth signing secret on Cloudflare
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$API_ACCESS_KEY"
          printf '%s' "$API_ACCESS_KEY" | npx wrangler secret put API_ACCESS_KEY
