name: Deploy NVIDIA GPT-OSS-120B API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nvidia-gpt-oss-api/**'
      - '.github/workflows/deploy-nvidia-gpt-oss-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/nvidia-gpt-oss-api/package.json

      - name: Install dependencies
        working-directory: scripts/nvidia-gpt-oss-api
        run: npm install

      - name: Verify Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "$RESPONSE" | jq '{success, result: {status, id}}'
          test "$(echo "$RESPONSE" | jq -r '.success')" = "true"
          ACCOUNT=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}")
          echo "$ACCOUNT" | jq '{success, result: {id, name}}'
          test "$(echo "$ACCOUNT" | jq -r '.success')" = "true"

      - name: Provision OAuth KV namespace
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TITLE="nvidia-gpt-oss-api-oauth"
          LIST=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100")
          KV_ID=$(echo "$LIST" | jq -r --arg title "$TITLE" '.result[] | select(.title == $title) | .id' | head -n 1)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            CREATED=$(curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"title\":\"${TITLE}\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces")
            KV_ID=$(echo "$CREATED" | jq -r '.result.id')
          fi
          test -n "$KV_ID"
          test "$KV_ID" != "null"
          echo "Using OAuth KV namespace: $KV_ID"
          sed -i "s/REPLACE_WITH_KV_ID/${KV_ID}/" wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scripts/nvidia-gpt-oss-api

      - name: Set NVIDIA API secret on Cloudflare
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          printf '%s' "$NVIDIA_API_KEY" | npx wrangler secret put NVIDIA_API_KEY

      - name: Set internal OAuth signing secret on Cloudflare
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$API_ACCESS_KEY"
          printf '%s' "$API_ACCESS_KEY" | npx wrangler secret put API_ACCESS_KEY
