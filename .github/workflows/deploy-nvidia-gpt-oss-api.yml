name: Deploy NVIDIA GPT-OSS-120B API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/nvidia-gpt-oss-api/**'
      - '.github/workflows/deploy-nvidia-gpt-oss-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/nvidia-gpt-oss-api/package.json

      - name: Install dependencies
        working-directory: scripts/nvidia-gpt-oss-api
        run: npm install

      - name: Verify Cloudflare API token
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Verifying Cloudflare API token..."
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "$RESPONSE" | jq '{success, result: {status, id}}'
          if [ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare API token verification failed."
            exit 1
          fi
          echo "Verifying Cloudflare account access..."
          ACCOUNT=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}")
          echo "$ACCOUNT" | jq '{success, result: {id, name}}'
          if [ "$(echo "$ACCOUNT" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare token cannot access the configured account ID."
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scripts/nvidia-gpt-oss-api

      - name: Set NVIDIA API secret on Cloudflare
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "NVIDIA_API_KEY GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$NVIDIA_API_KEY" | npx wrangler secret put NVIDIA_API_KEY \
            --api-token "$CLOUDFLARE_API_TOKEN" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Set API access secret on Cloudflare
        working-directory: scripts/nvidia-gpt-oss-api
        env:
          API_ACCESS_KEY: ${{ secrets.API_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$API_ACCESS_KEY" ]; then
            echo "API_ACCESS_KEY GitHub secret is missing."
            exit 1
          fi
          printf '%s' "$API_ACCESS_KEY" | npx wrangler secret put API_ACCESS_KEY \
            --api-token "$CLOUDFLARE_API_TOKEN" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID"
